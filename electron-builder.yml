appId: com.startboom.btcfloat
productName: BTC Float
artifactName: BTC-Float-${version}-${arch}-Setup.${ext}
directories:
  output: release
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: build/licenses
    to: licenses
  - from: node_modules/lightweight-charts/LICENSE
    to: licenses/lightweight-charts-LICENSE.txt
  - from: node_modules/vue/LICENSE
    to: licenses/vue-LICENSE.txt
  - from: node_modules/tslib/LICENSE.txt
    to: licenses/tslib-LICENSE.txt
  - from: node_modules/tslib/CopyrightNotice.txt
    to: licenses/tslib-CopyrightNotice.txt
npmRebuild: false
publish: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false
  deleteAppDataOnUninstall: false
